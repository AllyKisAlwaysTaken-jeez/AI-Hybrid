<!DOCTYPE html>
<html>
<head>
  <title>Portfolio Preview</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Portfolio Preview</h1>

  <h2>Theme: {{ memory.site.theme }}</h2>

  <p><strong>Name:</strong> {{ memory.site.name }}</p>
  <p><strong>Bio:</strong> {{ memory.site.bio }}</p>

  <h3>Skills</h3>
  <ul>
    {% for skill in memory.site.skills %}
      <li>{{ skill }}</li>
    {% endfor %}
  </ul>

  <a href="/assistant">← Edit Again</a>
</body>
</html>
